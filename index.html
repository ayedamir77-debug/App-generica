<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1F2D3D">
<link rel="manifest" href="manifest.json?v=1">

<title>App Lavori</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#F6F7F8;color:#14202B;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;font-size:16px}
#app{max-width:560px;margin:0 auto;padding:20px 16px 110px;min-height:100vh}
h1{font-size:24px;line-height:30px;margin:10px 0 12px}
h2{font-size:16px;margin:22px 0 10px}
p{margin:0 0 10px;line-height:1.45;color:#4E5A66}
.logo{width:44px;height:44px;border-radius:12px;background:#1F2D3D;color:#F28C28;display:flex;align-items:center;justify-content:center;font-size:24px;overflow:hidden;flex:none}
.logo img{width:100%;height:100%;object-fit:contain;background:#fff}
.hero{border-bottom:4px solid #F28C28;background:linear-gradient(135deg,#1F2D3D 0%,#34506E 100%);color:#fff;border-radius:16px;padding:16px;margin:6px 0 4px;position:relative;overflow:hidden}
.hero .nm{font-size:18px;font-weight:700;line-height:22px}
.hero .tg{font-size:12px;opacity:.8;margin-top:2px}
.hero .ico{display:flex;gap:10px;font-size:20px;margin-top:12px;opacity:.95}
.hero::after{content:attr(data-ic);position:absolute;right:-6px;top:-18px;font-size:96px;opacity:.10}
label{display:block;font-size:13px;font-weight:600;margin:14px 0 6px}
input,select,textarea{width:100%;border:1px solid #C9D0D6;border-radius:10px;padding:0 14px;font-size:16px;background:#fff;font-family:inherit;color:#14202B}
input,select{height:48px}
textarea{padding:12px 14px;line-height:1.4}
input:focus,select:focus,textarea:focus{outline:2px solid #1F2D3D;border-color:#1F2D3D}
button{height:48px;border-radius:10px;border:0;font-size:15px;font-weight:600;font-family:inherit;padding:0 18px;cursor:pointer}
button:disabled{opacity:.6}
.primary{background:#1F2D3D;color:#fff;width:100%;margin-top:16px;height:52px;font-size:16px}
.secondary{background:#fff;color:#1F2D3D;border:1px solid #1F2D3D}
.ghost{background:none;color:#1F2D3D;height:auto;padding:8px 0}
.danger{background:#fff;color:#A32121;border:1px solid #E3B4B4;width:100%;margin-top:12px}
.tabs{display:flex;gap:8px;margin:18px 0 4px}
.tab{flex:1;height:44px;background:#fff;border:1px solid #DDE2E6;color:#14202B}
.tab.on{background:#1F2D3D;color:#fff;border-color:#1F2D3D}
.card{background:#fff;border:1px solid #DDE2E6;border-radius:14px;padding:14px 16px;margin-bottom:12px}
.tap{cursor:pointer}
.row{display:flex;gap:10px;align-items:center;justify-content:space-between}
.btns{display:flex;flex-wrap:wrap;gap:10px;margin-top:12px}
.btns button{flex:1 1 40%;height:44px}
.deny{background:#fff;color:#14202B;border:1px solid #C9D0D6}
.ok{background:#1F2D3D;color:#fff}
.note{background:#E8ECF8;border-radius:12px;padding:14px 16px;font-size:14px;line-height:1.4;margin-top:14px}
.err{background:#FDECEC;color:#8A1C1C;border-radius:10px;padding:12px 14px;margin-top:14px;font-size:14px}
.code{font-size:22px;font-weight:700;letter-spacing:1px}
.muted{font-size:14px;color:#4E5A66}
.top{display:flex;justify-content:space-between;align-items:center;min-height:36px}
.chips{display:flex;gap:8px;margin:8px 0 14px;flex-wrap:wrap}
.chip{height:38px;padding:0 14px;background:#fff;border:1px solid #DDE2E6;border-radius:19px;font-size:14px;font-weight:500;color:#14202B}
.chip.on{background:#1F2D3D;border-color:#1F2D3D;color:#fff}
.badge{font-size:12px;font-weight:600;padding:4px 10px;border-radius:12px;white-space:nowrap}
.b-todo{background:#EEF0F2;color:#3B4651}.b-doing{background:#FFF1D6;color:#7A4B00}.b-done{background:#DDF3E4;color:#14602B}.b-void{background:#EEF0F2;color:#6B7580;text-decoration:line-through}
.when{font-size:14px;font-weight:600;color:#1F2D3D}
.title{font-size:17px;font-weight:600;margin:6px 0 2px}
.nav{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid #DDE2E6;display:flex;justify-content:space-around;padding:6px 4px calc(10px + env(safe-area-inset-bottom));z-index:5}
.nav button{background:none;color:#4E5A66;height:46px;padding:0 1px;font-size:10.5px;min-width:0;flex:1;border-radius:8px}
.nav button.on{color:#1F2D3D;background:#FDE7D2}
.link{display:inline-block;color:#1F2D3D;font-weight:600;text-decoration:none;padding:8px 0;margin-right:16px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-bottom:8px}
.cal .dh{font-size:12px;color:#4E5A66;text-align:center;padding:4px 0}
.cal button{height:46px;padding:0;background:#fff;border:1px solid #DDE2E6;color:#14202B;font-weight:500;position:relative}
.cal button.sel{background:#1F2D3D;color:#fff;border-color:#1F2D3D}
.cal button.today{border:2px solid #1F2D3D}
.cal button i{position:absolute;bottom:4px;left:50%;width:6px;height:6px;margin-left:-3px;border-radius:3px;background:#E08A00}
.cal button.sel i{background:#fff}
.sp{display:flex;gap:8px}.sp>*{flex:1}
.big{height:76px;font-size:19px;margin-top:8px}
.out{background:#A32121;color:#fff}
.fab{width:100%}
#rbar{position:fixed;left:0;right:0;bottom:62px;margin:0 auto;max-width:560px;background:#14202B;color:#fff;display:none;align-items:center;padding:4px 10px;z-index:6;border-radius:12px 12px 0 0;font-size:14px}
#rbar .ghost{color:#fff}
#offl{position:fixed;top:0;left:0;right:0;background:#E08A00;color:#fff;text-align:center;font-size:13px;padding:4px;z-index:9;display:none}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
/* ---- versione PC (schermo largo): menu a sinistra, contenuto più largo ---- */
@media (min-width:900px){
 #app{max-width:1100px;margin:0 0 0 250px;padding:28px 40px 60px}
 .nav{top:0;right:auto;bottom:0;width:250px;flex-direction:column;justify-content:flex-start;gap:6px;padding:18px 12px;border-top:0;border-right:1px solid #DDE2E6}
 .nav button{flex:none;height:54px;font-size:15px;display:flex;align-items:center;gap:12px;padding:0 14px;text-align:left;min-width:0}
 .nav button span{display:inline!important;font-size:22px!important;width:30px}
 .tm{display:none}
 .nav.side{overflow-y:auto;gap:2px;padding:14px 10px}
 .nav.side button{height:42px;font-size:15px}
 .nav.side button span{font-size:19px!important;width:28px}
 .nav .ntl{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:#7A8591;margin:14px 8px 4px}
 .grid{grid-template-columns:repeat(6,1fr)}
 .sq{min-height:110px}
 .cal button{height:56px}
 #rbar{left:250px;bottom:0;max-width:1000px;margin:0 auto 0 250px}
 .hero{padding:22px}
 .hero .nm{font-size:22px;line-height:26px}
 button.primary,button.secondary{max-width:420px}
 h1{font-size:28px}
}
@media (min-width:1500px){ #app{margin:0 auto;padding-left:290px;max-width:1400px;box-sizing:border-box} }

.sq{height:auto;min-height:96px;aspect-ratio:1/0.95;background:#fff;border:1px solid #DDE2E6;border-radius:14px;color:#14202B;font-size:13px;font-weight:600;line-height:1.2;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;padding:8px 4px;text-align:center}
.sq .ic{font-size:28px;line-height:30px}
.sq:active{background:#E8ECF8}
hr{border:0;border-top:1px solid #EAEDEF;margin:12px 0}
[data-ai]{display:none!important}
</style>

function fiscalDeadlines(reg, per, today) {
  const out = [], t = new Date(today || new Date()); t.setHours(0, 0, 0, 0);
  const end = new Date(t); end.setDate(end.getDate() + 90);
  const add = (y, m, d, label) => {
    const dt = new Date(y, m, d);
    while (dt.getDay() === 0 || dt.getDay() === 6) dt.setDate(dt.getDate() + 1);
    if (dt >= t && dt <= end) out.push({ date: dt, label });
  };
  const vat = reg !== "forfettario";
  for (let k = 0; k <= 4; k++) {
    const base = new Date(t.getFullYear(), t.getMonth() + k, 1), y = base.getFullYear(), m = base.getMonth();
    const d16 = m === 7 ? 20 : 16;
    add(y, m, d16, "F24: ritenute e contributi dei dipendenti (se hai dipendenti in busta paga)");
    if (vat && per === "mensile") add(y, m, d16, "Liquidazione e versamento IVA del mese precedente");
    if (vat && per !== "mensile") {
      if (m === 4) add(y, m, 16, "Versamento IVA 1° trimestre");
      if (m === 7) add(y, m, 20, "Versamento IVA 2° trimestre");
      if (m === 10) add(y, m, 16, "Versamento IVA 3° trimestre");
      if (m === 2) add(y, m, 16, "Versamento IVA 4° trimestre / saldo annuale");
    }
    if (vat && m === 11) add(y, m, 27, "Acconto IVA annuale");
    if (vat && m === 3) add(y, m, 30, "Dichiarazione IVA annuale");
    if (m === 5) add(y, m, 30, reg === "forfettario" ? "Saldo imposta sostitutiva e 1° acconto (o 30 luglio con +0,40%)" : "Saldo imposte sui redditi e 1° acconto");
    if (m === 10) add(y, m, 30, reg === "forfettario" ? "2° acconto imposta sostitutiva" : "2° acconto imposte sui redditi");
    if (m === 4 || m === 10 || m === 1) add(y, m, 16, "Contributi INPS fissi (se artigiano o commerciante)");
    if (m === 7) add(y, m, 20, "Contributi INPS fissi (se artigiano o commerciante)");
  }
  return out.sort((a, b) => a.date - b.date);
}

      }, () => alert("Permesso di posizione negato."), { timeout: 10000 });
    } else {
      const q = prompt("Per quale città vuoi il meteo?", wxGet()?.gps ? "" : (wxGet()?.name || ""));
      if (!q) return;
      const g = await wxGeocode(q).catch(() => null);
      if (!g) { alert("Città non trovata."); return; }
      wxSet(g); draw(g);
    }
  };
  (async () => {
    let pl = wxGet();
    if (!pl) { const city = cityFromAddress(co().address); if (city) pl = await wxGeocode(city).catch(() => null); if (pl) wxSet(pl); }
    if (pl) draw(pl); else box.replaceChildren(h("div", { class: "muted" }, "Meteo: scegli la città."), h("button", { class: "secondary", onclick: () => ask("city") }, "Imposta città"));
  })();
  return box;
}

/* ---------- team (datore) ---------- */
async function teamView() {
  await loadTeam();
  const entries = chk(await sb.from("time_entries").select("user_id,started_at,ended_at").gte("started_at", monthStart().toISOString()));
  const hours = {};
  for (const e of entries) hours[e.user_id] = (hours[e.user_id] || 0) + ((e.ended_at ? D(e.ended_at) : new Date()) - D(e.started_at));
  const pending = S.team.filter((t) => t.status === "pending"), active = S.team.filter((t) => t.status === "active");
  const decide = async (id, status) => { if (await attempt(async () => { chk(await sb.rpc("set_member_status", { p_user: id, p_status: status })); })) render(); };
  return [
    h("h1", {}, "Il tuo team"),
    h("div", { class: "card row" }, h("div", {}, h("div", { class: "muted" }, "Codice azienda da condividere"), h("div", { class: "code" }, S.p.companies?.join_code)),
      h("button", { class: "secondary", onclick: async (e) => { try { await navigator.clipboard.writeText(S.p.companies.join_code); e.target.textContent = "Copiato"; } catch { alert(S.p.companies.join_code); } } }, "Copia")),
    h("h2", {}, "Richieste in attesa (" + pending.length + ")"),
    pending.length ? pending.map((t) => h("div", { class: "card" }, h("div", {}, h("strong", {}, t.full_name), h("div", { class: "muted" }, t.email)),
      h("div", { class: "btns" }, h("button", { class: "deny", onclick: () => decide(t.id, "rejected") }, "Rifiuta"), h("button", { class: "ok", onclick: () => decide(t.id, "active") }, "Accetta")))) : h("p", {}, "Nessuna richiesta."),
    h("h2", {}, "Dipendenti attivi (" + active.length + ")"),
    active.length ? active.map((t) => h("div", { class: "card" }, h("div", { class: "row" }, h("div", {}, h("strong", {}, t.full_name), h("div", { class: "muted" }, t.email)),
      h("div", { style: "text-align:right" }, h("div", { class: "muted" }, "Ore del mese"), h("strong", {}, dur(hours[t.id] || 0)))),
      h("button", { class: "ghost", style: "margin-top:6px;color:#A32121", onclick: () => { if (confirm("Rimuovere " + t.full_name + " dall'azienda?")) decide(t.id, "rejected"); } }, "Rimuovi"))) : h("p", {}, "Ancora nessun dipendente."),
    S.team.some((t) => t.status === "rejected") ? [h("h2", {}, "Rifiutati o rimossi"), S.team.filter((t) => t.status === "rejected").map((t) => h("div", { class: "card row" }, h("div", {}, h("strong", {}, t.full_name), h("div", { class: "muted" }, t.email)), h("button", { class: "ok", style: "height:42px", onclick: () => decide(t.id, "active") }, "Riattiva")))] : null
  ];
}

(() => {

/* ---------- avvio ---------- */
sb.auth.onAuthStateChange((event, session) => {
  if (event === "PASSWORD_RECOVERY") { recovering = true; recoveryScreen(); return; }
  if (recovering) return;
  if (event === "SIGNED_OUT") { S.p = null; S.tab = "home"; S.sub = null; S.stack = []; authScreen(); }
  else if (event === "SIGNED_IN" && (!S.p || (session && session.user.id !== S.p.id))) boot();
});
if ("serviceWorker" in navigator) {
  try {
    const hadCtl = !!navigator.serviceWorker.controller; let reloaded = false;
    navigator.serviceWorker.addEventListener("controllerchange", () => {   // nuova versione pronta: ricarico da solo (se non stai scrivendo)
      const a = document.activeElement;
      if (!hadCtl || reloaded || (a && /^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName))) return;
      reloaded = true; location.reload();
    });
    navigator.serviceWorker.register("sw.js").then((r) => { try { r.update(); } catch { /* ignora */ } });
  } catch { /* non essenziale */ }
}
boot();
